services:
  taxi-postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres
    restart: unless-stopped
    networks:
      - taxi-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: taxidb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: taxipass
      TZ: "${TZ:-Europe/Moscow}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d taxidb"]
      interval: 5s
      timeout: 3s
      retries: 20

  app-client:
    build:
      context: src
      dockerfile: Dockerfile
      target: client
    container_name: app-client
    restart: always
    entrypoint: ["/opt/app/entrypoint.sh"]
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./.configs/:/opt/app/.configs
    networks:
      - taxi-net
    depends_on:
      taxi-postgres:
        condition: service_healthy
    environment:
      TZ: "${TZ:-Europe/Moscow}"
      DATABASE_SETTINGS__HOST: taxi-postgres
      DATABASE_SETTINGS__PORT: 5432
      DATABASE_SETTINGS__DATABASE: taxidb
      DATABASE_SETTINGS__USER: user
      DATABASE_SETTINGS__PASSWORD: taxipass

networks:
  taxi-net:

volumes:
  pg_data:
